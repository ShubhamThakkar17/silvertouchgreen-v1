<!doctype html>
<!-- Social share card (1200x630). Render with: node tools/render_og.js -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Plus Jakarta Sans"; src: url("../../assets/fonts/PlusJakartaSans-Variable.woff2") format("woff2"); font-weight: 200 800; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #072410; font-family: "Plus Jakarta Sans", sans-serif; }
  /* Green RE slide of the brand guidelines: deep green rising to brand green */
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, #072410 0%, #0f4a1b 55%, #1e7a20 100%); }
  .hand { position: absolute; right: -150px; bottom: -40px; width: 880px; opacity: .08; }
  .logo { position: relative; height: 108px; }
  h1 { position: relative; margin-top: 38px; font-size: 62px; font-weight: 700; line-height: 1.06; letter-spacing: -0.03em; max-width: 15ch; }
  h1 span { color: #ffb100; }
  .pill { position: absolute; left: 72px; bottom: 64px; display: inline-flex; align-items: center; gap: 14px;
    font-size: 19px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    background: #ffb100; color: #111; padding: 14px 24px; border-radius: 999px; }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #111; }
  .url { position: absolute; right: 72px; bottom: 78px; font-size: 20px; font-weight: 500; letter-spacing: .04em; color: #cfe0cb; }
  svg.art { position: absolute; right: 48px; top: 150px; width: 440px; }
</style>
</head>
