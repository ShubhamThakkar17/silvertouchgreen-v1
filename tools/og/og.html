<!doctype html>
<!-- Social share card (1200x630). Render with: node tools/render_og.js -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #07361d; font-family: "Plus Jakarta Sans", sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; color: #fff;
    background: radial-gradient(70% 90% at 92% 8%, rgba(196,220,102,.22), transparent 60%), linear-gradient(160deg, #0b4026, #062a17); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(220,240,228,.05) 1px, transparent 1px); background-size: 200px 100%; }
  .logo { height: 56px; filter: brightness(0) invert(1); position: relative; }
  h1 { position: relative; margin-top: 54px; font-size: 64px; line-height: 1.04; letter-spacing: -0.035em; max-width: 15ch; }
  h1 span { color: #c4dc66; }
  .pill { position: absolute; left: 72px; bottom: 64px; display: inline-flex; align-items: center; gap: 14px;
    font-family: "Geist Mono", monospace; font-size: 20px; letter-spacing: .08em; text-transform: uppercase;
    background: #c4dc66; color: #07361d; padding: 14px 22px; border-radius: 999px; }
  .pill i { width: 12px; height: 12px; border-radius: 50%; background: #07361d; }
  .url { position: absolute; right: 72px; bottom: 76px; font-family: "Geist Mono", monospace; font-size: 20px; letter-spacing: .06em; color: #a6bba7; }
  svg.art { position: absolute; right: 40px; top: 120px; width: 470px; }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <img class="logo" src="../../assets/img/logo-horizontal.svg" alt="" />
    <h1>Renewable energy for industrial, commercial &amp; <span>government facilities</span></h1>
    <svg class="art" viewBox="0 0 470 320" fill="none">
      <circle cx="360" cy="70" r="40" fill="#f4b321" />
      <circle cx="360" cy="70" r="62" stroke="#f4b321" stroke-dasharray="3 7" stroke-width="2" />
      <!-- container (isometric) -->
      <polygon points="140,170 300,262 380,216 220,124" fill="#e9efe6" />
      <polygon points="140,170 140,236 300,328 300,262" fill="#c6d2c3" />
      <polygon points="300,262 300,328 380,282 380,216" fill="#adbcaa" />
      <path d="M140 228 L300 320" stroke="#c4dc66" stroke-width="6" />
      <!-- panels -->
      <g fill="#2a5a73" stroke="#9fc6d8" stroke-width="1.5">
        <polygon points="20,250 80,250 92,226 32,226" /><polygon points="20,290 80,290 92,266 32,266" />
        <polygon points="96,290 156,290 168,266 108,266" />
      </g>
      <!-- turbine -->
      <path d="M440 300 L444 140 L448 300 Z" fill="#e9efe6" />
      <g fill="#fff"><path d="M444 140 q6 -30 0 -70 q-4 40 0 70Z" /><path d="M444 140 q6 -30 0 -70 q-4 40 0 70Z" transform="rotate(120 444 140)" /><path d="M444 140 q6 -30 0 -70 q-4 40 0 70Z" transform="rotate(240 444 140)" /></g>
    </svg>
    <div class="pill"><i></i>BESS assembly &middot; Dholera, Gujarat &middot; 2027</div>
    <div class="url">silvertouchgreen.com</div>
  </div>
</body>
</html>
